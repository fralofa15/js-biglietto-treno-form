<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto treno</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-danger">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4 text-danger">Calcolo Biglietto Treno</h1>

                        <form>
                            <!--Creazione input per l'inserimento dei dati fondamentali-->
                            <div class="mb-3">
                                <label for="km" class="form-label">Chilometri da percorrere</label>
                                <input type="number" id="km" class="form-control" placeholder="Inserisci i chilometri">
                            </div>

                            <div class="mb-3">
                                <label for="età" class="form-label">Età del passeggero</label>
                                <input type="number" id="età" class="form-control" placeholder="Inserisci l'età">
                            </div>

                            <!--Bottone per il calcolo del biglietto-->
                            <div class="d-grid">
                                <button id="calcola" class="btn btn-danger" type="submit">Calcola</button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <!--Output dati del biglietto-->
                        <div id="biglietto" class="bg-light rounded-4 p-3">
                            <h2 class="h4 text-center mb-3">Dettagli biglietto</h2>

                            <p class="mb-2">
                                <strong>Chilometri:</strong>
                                <span id="output_km">-</span>
                            </p>

                            <p class="mb-2">
                                <strong>Età:</strong>
                                <span id="output_eta">-</span>
                            </p>

                            <p class="mb-2">
                                <strong>Sconto applicato:</strong>
                                <span id="output_sconto">-</span>
                            </p>

                            <p class="mb-0">
                                <strong>Prezzo finale:</strong>
                                <span id="output_prezzo">-</span>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="function.js"></script>
    <script src="index.js"></script>
</body>

</html>
