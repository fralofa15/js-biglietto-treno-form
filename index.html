<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto treno</title>
</head>

<body>

    <form>
        <!--Creazione input per l'inserimento dei dati fondamentali-->
        <input type="number" id="km" placeholder="Inserisci i chilometri">
        <input type="number" id="età" placeholder="Inserisci l'età">

        <!--Bottone per il calcolo del biglietto-->
        <button id="calcola">Calcola</button>
    </form>

    <!--Output dati del biglietto-->
    <div id="biglietto">
        <p>Chilometri: <span id="output_km">-</span></p>
        <p>Età: <span id="output_eta">-</span></p>
        <p>Sconto applicato: <span id="output_sconto">-</span></p>
        <p>Prezzo finale: <span id="output_prezzo">-</span></p>
    </div>

    <script src="function.js"></script>
    <script src="index.js"></script>
</body>

</html>
